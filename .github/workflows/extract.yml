name: Extract ZIP

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/extract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Extract ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob dotglob

          found=0

          for z in *.zip; do
            [ -f "$z" ] || continue
            found=1

            echo "Extracting $z"

            tmp="$(mktemp -d)"
            unzip -oq "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"

            entries=()
            for item in "$tmp"/*; do
              [ -e "$item" ] || continue
              entries+=("$item")
            done

            if [ "${#entries[@]}" -eq 1 ] &&
               [ -d "${entries[0]}" ]; then
              cp -a "${entries[0]}/." .
            else
              cp -a "$tmp/." .
            fi

            rm -rf "$tmp"
            git rm -f --ignore-unmatch -- "$z"
          done

          if [ "$found" -eq 0 ]; then
            echo "No ZIP files found in repository root."
            exit 1
          fi

      - name: Commit and push extracted files
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Edsora ZIP files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
