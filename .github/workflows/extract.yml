name: Extract ZIP

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/extract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          shopt -s nullglob

          for z in *.zip; do
            echo "Processing: $z"

            mkdir -p /tmp/edsora_extract
            rm -rf /tmp/edsora_extract/*
            unzip -oq "$z" -d /tmp/edsora_extract

            rm -rf /tmp/edsora_extract/__MACOSX

            entries=(/tmp/edsora_extract/*)

            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              cp -a "${entries[0]}/." .
            else
              cp -a /tmp/edsora_extract/. .
            fi

            rm -rf /tmp/edsora_extract
            git rm -f --ignore-unmatch "$z"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract ZIP into repository"
          git push
